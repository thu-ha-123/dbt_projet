models:
- name: fct_orders
  config:
    contract:
      enforced: true
  columns:
    - name: order_id
      data_type: number
      constraints:
        - type: not_null
    - name: customer_id
      data_type: number
    - name: order_placed_at
      data_type: date
    - name: amount
      data_type: number